<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>sign up  </title>
</head>
<body>{% extends 'base.html' %}

{% block title %}Sign Up - CANTMAN{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="text-center mb-4">
        <h1 class="fw-bold">CANTMAN</h1>
        <h2>Create Account</h2>
        <p class="text-muted">Create a new account to access CANTMAN</p>
    </div>

    <div class="card shadow-sm mx-auto" style="max-width: 450px;">

        <div class="card-body">

            {% if error %}
                <div class="alert alert-danger">
                    {{ error }}
                </div>
            {% endif %}

            <form method="POST" action="/register_post/">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Username</label>

                    <input type="text"
                           name="username"
                           class="form-control"
                           placeholder="Enter username"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Password</label>

                    <input type="password"
                           name="password"
                           class="form-control"
                           placeholder="Enter password"
                           required>
                </div>

                <button type="submit" class="btn btn-success w-100">
                    Sign Up
                </button>

            </form>

            <div class="text-center mt-3">
                <p>Already have an account?</p>

                <a href="/login/" class="btn btn-outline-primary">
                    Login
                </a>
            </div>

        </div>

    </div>

</div>

{% endblock %}
</body>
</html>
