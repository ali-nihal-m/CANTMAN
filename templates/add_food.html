{% extends 'base.html' %}

{% block title %}Add Food - CANTMAN{% endblock %}

{% block content %}

<div class="container mt-5">

    <div class="text-center mb-4">
        <h1 class="fw-bold">CANTMAN</h1>
        <h2>Add Food Item</h2>
        <p class="text-muted">Add a new item to the canteen</p>
    </div>

    <div class="card shadow-sm mx-auto" style="max-width: 600px;">

        <div class="card-body">

            <form method="POST" action="/add_food_post/">

                {% csrf_token %}

                <div class="mb-3">
                    <label class="form-label">Food Name</label>

                    <input type="text"
                           name="food_name"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Category</label>

                    <input type="text"
                           name="category"
                           class="form-control"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Description</label>

                    <textarea name="description"
                              class="form-control"
                              rows="3"
                              required></textarea>
                </div>

                <div class="mb-3">
                    <label class="form-label">Price</label>

                    <input type="number"
                           name="price"
                           class="form-control"
                           step="0.01"
                           required>
                </div>

                <div class="mb-3">
                    <label class="form-label">Quantity</label>

                    <input type="number"
                           name="quantity"
                           class="form-control"
                           required>
                </div>

                <button type="submit" class="btn btn-success">
                    Add Food
                </button>

                <a href="/home/" class="btn btn-secondary">
                    Back to Home
                </a>

            </form>

        </div>

    </div>

</div>

{% endblock %}
